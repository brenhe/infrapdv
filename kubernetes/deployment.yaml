apiVersion: apps/v1
kind: Deployment
metadata:
  name: clone
  namespace: names-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clone
  template:
    metadata:
      labels:
        app: clone
    spec:
      containers:
        - name: clone
          image: "brenhe/hello-world-api:1171f03733b23e610ec113efd651bd2b39ad1261"
          ports:
            - containerPort: 3005

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clone
  namespace: names-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clone
  template:
    metadata:
      labels:
        app: clone
    spec:
      containers:
        - name: clone
          image: "brenhe/hello-world-api:66e8a8c598fd765141301d98fd7101fb02cc5c2b"
          ports:
            - containerPort: 3005
